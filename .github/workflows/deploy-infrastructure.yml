name: Deploy infrastructure (Terraform)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "infrastructure/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  terraform-plan-dev:
    name: Terraform plan (dev)
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_service_principal_object_id: ${{ secrets.AZURE_SERVICE_PRINCIPAL_OBJECT_ID }}
      TF_VAR_github_actions_sp_object_id: ${{ secrets.AZURE_GITHUB_ACTIONS_SP_OBJECT_ID }}
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Select workspace dev
        run: terraform workspace select dev || terraform workspace new dev

      - name: Terraform plan
        run: terraform plan -input=false -var-file=dev.tfvars -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/tfplan
          if-no-files-found: error

  terraform-apply-dev:
    name: Terraform apply (dev)
    runs-on: ubuntu-latest
    needs: terraform-plan-dev
    environment: dev
    env:
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_service_principal_object_id: ${{ secrets.AZURE_SERVICE_PRINCIPAL_OBJECT_ID }}
      TF_VAR_github_actions_sp_object_id: ${{ secrets.AZURE_GITHUB_ACTIONS_SP_OBJECT_ID }}
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure

      - name: Terraform init
        run: terraform init -input=false

      - name: Select workspace dev
        run: terraform workspace select dev

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

  terraform-plan-prod:
    name: Terraform plan (prod)
    runs-on: ubuntu-latest
    needs: terraform-apply-dev
    if: github.ref == 'refs/heads/main'
    environment: dev
    env:
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_service_principal_object_id: ${{ secrets.AZURE_SERVICE_PRINCIPAL_OBJECT_ID }}
      TF_VAR_github_actions_sp_object_id: ${{ secrets.AZURE_GITHUB_ACTIONS_SP_OBJECT_ID }}
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Select workspace prod
        run: terraform workspace select prod || terraform workspace new prod

      - name: Terraform plan
        run: terraform plan -input=false -var-file=prod.tfvars -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: infrastructure/tfplan
          if-no-files-found: error

  terraform-apply-prod:
    name: Terraform apply (prod)
    runs-on: ubuntu-latest
    needs: terraform-plan-prod
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_service_principal_object_id: ${{ secrets.AZURE_SERVICE_PRINCIPAL_OBJECT_ID }}
      TF_VAR_github_actions_sp_object_id: ${{ secrets.AZURE_GITHUB_ACTIONS_SP_OBJECT_ID }}
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: infrastructure

      - name: Terraform init
        run: terraform init -input=false

      - name: Select workspace prod
        run: terraform workspace select prod

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
